<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMS - Dorm Portal Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .login-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 40px 20px;
      overflow-y: auto;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 50px 40px;
      animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      margin: auto;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: slideInDown 0.6s ease forwards;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      animation: slideInDown 0.7s ease forwards;
      animation-delay: 0.1s;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: slideInDown 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 30px 0;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .demo-creds {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: var(--border-radius-sm);
      font-size: 12px;
      animation: fadeInUp 0.9s ease forwards;
      animation-delay: 0.3s;
    }

    .demo-cred-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition-fast);
      padding: 4px 0;
    }

    .demo-cred-item:hover {
      transform: translateX(4px);
    }

    .demo-cred-item strong {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .demo-cred-item code {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: var(--accent-cyan);
      font-weight: 600;
      border: 1px solid rgba(0, 212, 255, 0.2);
      transition: var(--transition-fast);
    }

    .demo-cred-item:hover code {
      background: rgba(0, 212, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.4);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.4s;
    }

    .login-footer a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: var(--transition-fast);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .login-footer a:hover {
      color: var(--accent-purple);
      transform: translateX(-4px);
    }

    /* Form animations */
    .form-group {
      animation: fadeInUp 0.6s ease forwards;
    }

    .form-group:nth-child(1) { animation-delay: 0.1s; }
    .form-group:nth-child(2) { animation-delay: 0.2s; }
    .form-group:nth-child(3) { animation-delay: 0.3s; }

    .btn-primary {
      animation: fadeInUp 0.7s ease forwards;
      animation-delay: 0.4s;
    }

    .btn-ghost {
      animation: fadeInUp 0.7s ease forwards;
      animation-delay: 0.45s;
    }

    .login-divider {
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.5s;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 24px;
      }

      .login-header h1 {
        font-size: 24px;
      }

      .login-logo {
        font-size: 24px;
      }

      .login-subtitle {
        font-size: 12px;
      }

      .demo-creds {
        font-size: 11px;
        padding: 12px;
      }

      .demo-cred-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .demo-cred-item code {
        width: 100%;
        text-align: center;
        padding: 6px 4px;
      }

      .btn {
        font-size: 13px;
        padding: 10px 16px;
      }

      .form-input,
      .form-select {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animated">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <div id="toast-container"></div>

  <div class="login-container">
    <div class="login-card glass-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fa-solid fa-building-columns"></i>
          <span>DMS</span>
        </div>
        <h1 class="gradient-text">Dorm Portal</h1>
        <p class="login-subtitle">Dormitory Management System</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username / Student ID</label>
          <div class="input-icon-wrap">
            <input type="text" id="username" class="form-input" placeholder="admin or student ID" required autocomplete="username">
            <i class="fa-solid fa-user input-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon-wrap">
            <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
            <i class="fa-solid fa-lock input-icon"></i>
            <button type="button" class="toggle-pw" onclick="togglePassword()" tabindex="-1" title="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group" style="display: flex; gap: 10px; align-items: center; margin-bottom: 24px;">
          <input type="checkbox" id="rememberMe" style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent-cyan);">
          <label for="rememberMe" style="margin: 0; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none;">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom: 10px;">
          <i class="fa-solid fa-arrow-right"></i> Login
        </button>

        <button type="reset" class="btn btn-ghost btn-full" style="margin-bottom: 20px;">
          <i class="fa-solid fa-rotate-left"></i> Clear
        </button>
      </form>

      <div class="login-divider">
        <span>Demo Credentials</span>
      </div>

      <div class="demo-creds">
        <div class="demo-cred-item">
          <strong>Admin:</strong>
          <code>admin / 3265/17</code>
        </div>
        <div class="demo-cred-item">
          <strong>Student 1:</strong>
          <code>3265/17 / 3265/17</code>
        </div>
        <div class="demo-cred-item">
          <strong>Student 2:</strong>
          <code>1580/17 / 1580/17</code>
        </div>
      </div>

      <div class="login-footer">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const btn = event.currentTarget;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      const admin = getAdmin();
      const students = getStudents();

      // Check if admin (case-insensitive)
      if (username === admin.username.toLowerCase() && password === admin.password) {
        localStorage.setItem('dms_user', JSON.stringify({ role: 'admin', username: admin.username }));
        showToast('Admin login successful!', 'success');
        setTimeout(() => window.location.href = 'admin.html', 600);
        return;
      }

      // Check if student (case-insensitive)
      const student = students.find(s => s.id.toLowerCase() === username && s.id === password);
      if (student) {
        localStorage.setItem('dms_user', JSON.stringify({ role: 'student', id: student.id, name: student.name }));
        showToast('Student login successful!', 'success');
        setTimeout(() => window.location.href = 'student.html', 600);
        return;
      }

      // Shake animation on error
      document.getElementById('loginForm').classList.add('shake');
      showToast('Invalid credentials', 'error');
      setTimeout(() => document.getElementById('loginForm').classList.remove('shake'), 500);
    }

    // Check if already logged in
    const user = getCurrentUser();
    if (user) {
      if (user.role === 'admin') window.location.href = 'admin.html';
      else if (user.role === 'student') window.location.href = 'student.html';
    }
  </script>
</body>
</html>
